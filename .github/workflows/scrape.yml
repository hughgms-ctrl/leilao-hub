# Plano B: worker no GitHub Actions em vez do VPS.
#
# DESATIVADO DE PROPÓSITO: só roda quando você clica "Run workflow" na aba
# Actions (workflow_dispatch). O bloco `schedule` está comentado — se
# descomentar, DESLIGUE o cron do VPS antes, senão os dois batem no site
# no mesmo horário e dobram a carga sobre o leiloeiro.
name: scrape + normalize

on:
  workflow_dispatch:
    inputs:
      pular_scrape:
        description: 'Rodar só o normalize (não bate no site)'
        type: boolean
        default: false

  # schedule:
  #   - cron: '0 */6 * * *'   # a cada 6h — ver aviso acima

# Uma execução por vez: Actions não tem flock, isto faz o mesmo papel.
concurrency:
  group: pipeline-leilao
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Conferir segredo do banco
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::secret DIRECT_DATABASE_URL não configurado no repositório"
            exit 1
          fi

      - name: Scrape
        if: ${{ !inputs.pular_scrape }}
        run: npm run scrape

      - name: Normalize
        run: npm run normalize

      # Sobe o log como artefato: o runner é descartado ao fim do job.
      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: '*.log'
          if-no-files-found: ignore
          retention-days: 14
