# Worker: coleta do leiloeiro + normalização, no GitHub Actions.
#
# O schedule está COMENTADO de propósito. Ative só quando o run manual
# estiver verde — e, se um dia voltar a existir um worker em VPS,
# DESLIGUE um dos dois: rodar os dois dobra a carga sobre o leiloeiro.
name: scrape + normalize

on:
  workflow_dispatch:
    inputs:
      pular_scrape:
        description: 'Rodar só o normalize (não bate no site do leiloeiro)'
        type: boolean
        default: false

  # schedule:
  #   - cron: '0 */6 * * *'   # a cada 6h — ver aviso acima

# Nunca dois runs em paralelo: duas coletas simultâneas furariam o
# DELAY_MS de 2s que existe para não tomar bloqueio do Azion.
concurrency:
  group: pipeline-leilao
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        # o bootstrap de cookies do Azion precisa de um browser real
        run: npx playwright install --with-deps chromium

      - name: Conferir secret do banco
        # falha cedo e com mensagem clara em vez de estourar no meio do scrape.
        # Nunca imprime o valor — só se existe.
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::secret DIRECT_DATABASE_URL não configurado no repositório (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "secret presente"

      - name: Scrape
        if: ${{ !inputs.pular_scrape }}
        run: npm run scrape

      - name: Normalize
        run: npm run normalize

      # Bloqueio do Azion é SILENCIOSO: o scrape termina com exit 0 e zero
      # lote coletado. Sem este passo o workflow ficaria verde com a base
      # envelhecendo. Aqui isso vira ❌.
      - name: Verificar que a coleta atualizou dados
        if: ${{ !inputs.pular_scrape }}
        run: npm run verify

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: '*.log'
          if-no-files-found: ignore
          retention-days: 14
